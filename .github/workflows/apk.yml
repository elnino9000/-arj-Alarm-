name: APK olustur
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Sabit imza anahtari
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Proje iskeleti
        run: |
          mkdir -p lib && mv main.dart lib/main.dart
          flutter create --platforms=android --project-name sarjalarmi --org com.sarjalarmi .
      - name: Android kodlarini yerlestir
        run: |
          KT=android/app/src/main/kotlin/com/sarjalarmi/sarjalarmi
          mkdir -p "$KT"
          cp native/*.kt "$KT"/
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/raw
          cp native/sarj_alarm.wav android/app/src/main/res/raw/sarj_alarm.wav
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - name: Gradle ayarlari
        run: |
          python3 - <<'PY'
          import re, pathlib
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              g = p.read_text(encoding='utf-8')
              kts = f.endswith('.kts')
              g = g.replace('flutter.minSdkVersion', '26')
              rflag = 'isMinifyEnabled = false\n            isShrinkResources = false' if kts else 'minifyEnabled false\n            shrinkResources false'
              g = re.sub(r'release\s*\{', lambda mo: mo.group(0) + '\n            ' + rflag, g, count=1)
              p.write_text(g, encoding='utf-8')
              print('patched', f)
          PY
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: sarj-alarmi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
